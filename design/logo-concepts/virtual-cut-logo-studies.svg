<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1370" viewBox="0 0 1760 1370"><rect width="1760" height="1370" fill="#121617"/><text x="70" y="66" fill="#71D7CD" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="3">VIRTUAL CUT  /  LOGO STUDIES</text><text x="70" y="121" fill="#F0F3F2" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">A V that cuts. A C in the film.</text><text x="70" y="158" fill="#A9B1B0" font-family="Segoe UI, Arial, sans-serif" font-size="17" >Four vector directions from your sketch. Teal #04635F with a lighter companion for dark surfaces.</text><rect x="70" y="200" width="795" height="515" rx="16" fill="#1B2021" stroke="#343D3D"/><text x="98" y="241" fill="#71D7CD" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.4">01  /  CLOSEST TO YOUR SKETCH</text><g transform="translate(136 257) scale(0.896875)" color="#F0F3F2"><g fill-rule="evenodd"><path fill="#71D7CD" d="M26 38H80L168 282H114ZM236 38H280L258 100H214ZM172 256H202L192 282H162Z"/><path fill="#04635F" d="M118 114H300L248 180L300 246H166Z"/></g></g><path d="M481 278V517" stroke="#343D3D"/><rect x="525" y="277" width="116" height="116" rx="16" fill="#F0F3F2"/><g transform="translate(536 288) scale(0.29375)" color="#F0F3F2"><g fill-rule="evenodd"><path fill="#04635F" d="M26 38H80L168 282H114ZM236 38H280L258 100H214ZM172 256H202L192 282H162Z"/><path fill="#39968E" d="M118 114H300L248 180L300 246H166Z"/></g></g><text x="661" y="340" fill="#9BA8A6" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.2">LIGHT</text><g transform="translate(534 412) scale(0.3)" color="#F0F3F2"><g fill-rule="evenodd"><path fill="currentColor" d="M26 38H80L168 282H114ZM236 38H280L258 100H214ZM172 256H202L192 282H162Z"/><path fill="currentColor" d="M118 114H300L248 180L300 246H166Z"/></g></g><text x="661" y="464" fill="#9BA8A6" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-s