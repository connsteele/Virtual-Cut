name: Windows regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # The runner context is unavailable in job-level env, so set the suite output here.
      - name: Use the runner's temporary directory for test runs
        run: Add-Content -Path $env:GITHUB_ENV -Value "VIRTUAL_CUT_SUITE_OUTPUT=$env:RUNNER_TEMP\virtual-cut-test-runs"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install synthetic media prerequisites
        run: |
          choco install ffmpeg --yes --no-progress
          # Chocolatey's ffmpeg.exe is a shim that runs the real FFmpeg as a second process with
          # the same command line. Put the real binaries first so checks see one process per tool.
          $bin = Split-Path (Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Add-Content -Path $env:GITHUB_ENV -Value "VIRTUAL_CUT_FFMPEG=$bin\ffmpeg.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "VIRTUAL_CUT_FFPROBE=$bin\ffprobe.exe"
      - name: Measure native and desktop coverage with regression gates
        run: npm run test:coverage
      - name: Keep reports and bounded logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-regression-reports
          path: |
            ${{ runner.temp }}/virtual-cut-test-runs/**/report.json
            ${{ runner.temp }}/virtual-cut-test-runs/**/report.md
            ${{ runner.temp }}/virtual-cut-test-runs/run-*/*.log
            ${{ runner.temp }}/virtual-cut-test-runs/**/coverage/summary.json
            ${{ runner.temp }}/virtual-cut-test-runs/**/coverage/sources.json
            ${{ runner.temp }}/virtual-cut-test-runs/**/coverage/renderer/**
            ${{ runner.temp }}/virtual-cut-test-runs/**/coverage/native/**
            ${{ runner.temp }}/virtual-cut-test-runs/**/coverage/combined/**
          retention-days: 7
